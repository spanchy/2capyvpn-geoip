name: Build geoip
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - "release/**"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout v2fly/geoip
        uses: actions/checkout@v7
        with:
          repository: v2fly/geoip
          path: geoip
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: geoip/go.mod
          cache: true
          cache-dependency-path: geoip/go.sum

      - name: Overlay custom files over geoip
        run: |
          set -euo pipefail
          cp -f ./*.json geoip/ 2>/dev/null || true
          cp -f ./changes/*.txt  geoip/ 2>/dev/null || true
          cp -f ./*.py   geoip/ 2>/dev/null || true

      - name: Set tag
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          DAILY_TAG=$(date +%Y%m%d%H%M)
          echo "DAILY_TAG=$DAILY_TAG" >> "$GITHUB_ENV"

      - name: Create Tag
        if: github.ref_name == 'master'
        uses: actions/github-script@v9
        with:
          script: |
            const { DAILY_TAG } = process.env
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${DAILY_TAG}`,
              sha: context.sha
            })

      - name: Download inputs (IP lists + Geobases)
        working-directory: geoip
        run: |
          set -euo pipefail
          CURL="curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"

          $CURL -o russiafancy-full.lst https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/blacklist/ipsets/full.lst
          $CURL -o antifilter-allyouneed.lst https://antifilter.download/list/allyouneed.lst
          $CURL -o russiafancy-cdn.lst https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/blacklist/ipsets/cdn.lst
          $CURL -o discord-ipset.txt https://raw.githubusercontent.com/fatyzzz/ipset-discord/refs/heads/main/discord.txt
          $CURL -o discord-voice.txt https://raw.githubusercontent.com/GhostRooter0953/discord-voice-ips/refs/heads/master/voice_domains/discord-voice-ip-list
          $CURL -o whitelist-source.lst https://raw.githubusercontent.com/Noktomezo/RussiaFancyLists/main/lists/whitelist/cidr.lst
          test -s russiafancy-full.lst
          test -s antifilter-allyouneed.lst
          test -s russiafancy-cdn.lst
          test -s discord-ipset.txt
          test -s discord-voice.txt
          test -s whitelist-source.lst

          $CURL -o geolite_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/ru.lst
          $CURL -o geolite_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/geolite2-geo-whois-asn-country-ipv4/by.lst
          $CURL -o ipinfo_ru.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/ru.lst
          $CURL -o ipinfo_by.lst https://raw.githubusercontent.com/Davoyan/ipinfo/refs/heads/main/geo/geoip/by.lst
          $CURL -o dbip_ru.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/ru.lst
          $CURL -o dbip_by.lst https://raw.githubusercontent.com/hydraponique/countrydb/refs/heads/main/output/dbip-country-ipv4/by.lst
          
      - name: Build geoip tool
        working-directory: geoip
        run: |
          set -euo pipefail
          go build -o geoip

      - name: Generate geoip artifacts
        working-directory: geoip
        run: |
          set -euo pipefail
          rm -rf tmp output
          mkdir -p tmp/text output/dat output/text
          rm -f ./tmp/text/prepare.txt
          : > ./tmp/text/prepare.txt

          python3 ipset_ops.py --mode union \
            --set ./russiafancy-full.lst,./antifilter-allyouneed.lst,./threema.txt,./custom.txt,./discord-ipset.txt,./discord-voice.txt \
            --out ./ban-ru.txt
          python3 ipset_ops.py --mode union \
            --set ./russiafancy-cdn.lst \
            --out ./cdn.txt
          python3 ipset_ops.py --mode diff \
            --A ./whitelist-source.lst \
            --B ./ban-ru.txt \
            --out ./whitelist.txt

          for f in ./geolite_ru.lst ./geolite_by.lst ./ipinfo_ru.lst ./ipinfo_by.lst ./dbip_ru.lst ./dbip_by.lst ./direct.txt; do
            if [ -f "$f" ]; then
              cat "$f" >> ./tmp/text/prepare.txt
              printf '\n' >> ./tmp/text/prepare.txt
            fi
          done
          
          python3 ipset_ops.py --mode diff \
            --A ./tmp/text/prepare.txt \
            --B ./ban-ru.txt,./cdn.txt,./threema.txt,./custom.txt,./list-del.txt \
            --out ./tmp/text/final.txt

          ./geoip -c config.json
          ls -l output/dat/*.dat

      - name: Prepare workdir (copy ALL text files + clean with awk)
        run: |
          set -euo pipefail

          work=/tmp/geoip-text
          rm -rf "$work"
          mkdir -p "$work"

          shopt -s nullglob
          cp -f geoip/output/text/*.txt "$work"/
          shopt -u nullglob

          for f in "$work"/*.txt; do
            tmp="$(mktemp)"
            awk '
              function trim(s){ sub(/^[ \t]+/,"",s); sub(/[ \t]+$/,"",s); return s }
              {
                gsub(/\r/,"")
                s=$0

                sub(/[ \t]*#.*/,  "", s)
                sub(/[ \t]*\/\/.*/, "", s)
                sub(/[ \t]*@.*/,  "", s)

                s=trim(s)
                if (s=="") next
                print s
              }
            ' "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Prepare release directory and archives
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          rm -rf release
          rm -rf /tmp/release
          mkdir -p release/text
          cp geoip/output/dat/*.dat release/
          cp -f /tmp/geoip-text/*.txt release/text/
          rm -f /tmp/text.tar.gz
          tar -czf /tmp/text.tar.gz -C release text
          test -s /tmp/text.tar.gz
          sha256sum release/geoip.dat > release/geoip.dat.sha256
          cp -r release /tmp/release

      - name: Git push assets to "release" branch
        if: github.ref_name == 'master'
        run: |
          cd release || exit 1
          git init
          git config --local user.name "spanchy"
          git config --local user.email "spanchy@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "Release ${{ env.DAILY_TAG }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
          cd .. || exit 1
          git config --local user.name "spanchy"
          git config --local user.email "spanchy@users.noreply.github.com"
          git checkout master
          rm -rf release
          cp -r /tmp/release ./release
          git add release/
          git commit -m "Release ${{ env.DAILY_TAG }}" || echo "No changes to commit"
          git push origin master
          
      - name: Purge jsdelivr CDN
        if: github.ref_name == 'master'
        run: |
          set -euo pipefail
          cd release || exit 1
          find . -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ env.DAILY_TAG }}/release/${rel}"
          done

      - name: Publish release
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DAILY_TAG }}
          name: ${{ env.DAILY_TAG }}
          prerelease: false
          draft: false
          files: |
            release/*.dat
            release/*.dat.sha256
            /tmp/text.tar.gz
